name: build_pr
on:
  push:
    branches:
      - master
env:
  MYNAME: hinoshiba
jobs:
  builder:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - IMGNAME: workbench
          - IMGNAME: golang
          - IMGNAME: rust
          - IMGNAME: python
          - IMGNAME: node
          - IMGNAME: research
          - IMGNAME: cvemaker
          - IMGNAME: claude-codex
    steps:
      - name: Get current week-id
        id: date
        run: echo "Weekid=$(date +'%Y%U')" >> "$GITHUB_OUTPUT"
      - name: Checkout from repository.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve checkout versions and image dependencies
        id: image
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            python3 scripts/image_build.py ${{ matrix.IMGNAME }} >> "$GITHUB_OUTPUT"
          else
            python3 scripts/image_build.py ${{ matrix.IMGNAME }} --base "$BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: steps.image.outputs.changed == 'true'
      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.changed == 'true'
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: steps.image.outputs.changed == 'true'
      - name: Build and Push to Docker Hub.
        uses: docker/build-push-action@v6
        with:
          context: dockerfiles/${{matrix.IMGNAME}}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.MYNAME }}/${{ matrix.IMGNAME }}:latest
            ${{ env.MYNAME }}/${{ matrix.IMGNAME }}:${{ steps.date.outputs.Weekid }}
          build-args: |
            ${{ steps.image.outputs.build_args }}
        if: steps.image.outputs.changed == 'true'
