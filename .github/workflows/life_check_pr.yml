name: life check
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product: [golang, python, rust, node]
    concurrency:
      group: lifecycle-${{ matrix.product }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate lifecycle metadata and select a newer patch in this cycle
        id: lifecycle
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          python3 scripts/version_lifecycle.py --product "$PRODUCT" --update --report-dir .tmp
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: steps.lifecycle.outputs.changed == 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.lifecycle.outputs.changed == 'true'
      - name: Build the proposed image on both architectures
        uses: docker/build-push-action@v6
        with:
          context: dockerfiles/${{ matrix.product }}
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            strict=${{ steps.lifecycle.outputs.version }}
        if: steps.lifecycle.outputs.changed == 'true'
      - name: Build and smoke-test the updated runtime images
        # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          python3 - <<'PY'
          import grp
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, 'scripts')
          from image_build import build_args

          repository = Path.cwd()
          docker_gid = grp.getgrnam('docker').gr_gid
          expected_versions = []
          for variable, product in [('RUST', 'rust'), ('GO', 'golang'), ('PYTHON', 'python'), ('NODE', 'node')]:
              version = (repository / 'version' / product / 'strict').read_text().strip()
              expected_versions.extend(['--env', 'EXPECTED_' + variable + '=' + version])

          images = ['workbench', 'claude-codex']
          if os.environ['PRODUCT'] == 'node':
              images.insert(0, 'node')
          for image in images:
              tag = 'dockerfiles-lifecycle-' + image + ':candidate'
              command = ['docker', 'buildx', 'build', '--platform', 'linux/amd64', '--load', '--tag', tag]
              for argument in build_args(repository, image):
                  command.extend(['--build-arg', argument])
              if image != 'node':
                  command.extend(['--build-arg', 'local_docker_gid=' + str(docker_gid)])
              command.append(str(repository / 'dockerfiles' / image))
              subprocess.run(command, check=True)

              smoke_scripts = ['composite-image-smoke.sh']
              if image == 'node':
                  smoke_scripts = ['node-image-smoke.sh']
              elif image == 'workbench':
                  smoke_scripts.append('workbench-image-smoke.sh')
              for smoke_script in smoke_scripts:
                  command = ['docker', 'run', '--rm', '-i', '--entrypoint', '/bin/bash']
                  command.extend(expected_versions)
                  command.extend([tag, '-s'])
                  with (repository / 'tests' / smoke_script).open('rb') as script:
                      subprocess.run(command, stdin=script, check=True)
              subprocess.run(['docker', 'image', 'rm', tag], check=True)
          PY
        if: steps.lifecycle.outputs.changed == 'true'
      - name: Create a version pull request
        uses: peter-evans/create-pull-request@v8
        with:
          title: '[NewVersion] ${{ matrix.product }}/${{ steps.lifecycle.outputs.version }}'
          body: |
            Update ${{ matrix.product }} from ${{ steps.lifecycle.outputs.previous }} to ${{ steps.lifecycle.outputs.version }} in the existing ${{ steps.lifecycle.outputs.cycle }} cycle.
            The proposed image was built for linux/amd64 and linux/arm64.
            Workbench and claude-codex were built and smoke-tested on linux/amd64 using these checkout pins.
          commit-message: "chore: update ${{ matrix.product }} to ${{ steps.lifecycle.outputs.version }}"
          branch: Update/${{ matrix.product }}/${{ steps.lifecycle.outputs.version }}
          add-paths: version/${{ matrix.product }}/strict
        if: steps.lifecycle.outputs.changed == 'true'
      - name: Report end of life
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          update_existing: true
          search_existing: open
          filename: .tmp/eol.md
        if: steps.lifecycle.outputs.eol == 'true'
      - name: Report the end of active support separately
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          update_existing: true
          search_existing: open
          filename: .tmp/support_out.md
        if: steps.lifecycle.outputs.support_out == 'true'
