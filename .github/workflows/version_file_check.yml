name: version file check
on:
  pull_request:
jobs:
  file_check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout from repository.
        uses: actions/checkout@v2
      - name: Check a files
        run: |
            find ./version -maxdepth 1 -mindepth 1 | xargs -I{} sh -c "grep -qFf {}/major {}/strict || exit 1"
