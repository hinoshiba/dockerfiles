name: build_cron
on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:
env:
  MYNAME: hinoshiba
jobs:
  builder:
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ matrix.IMGNAME }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - IMGNAME: workbench
          - IMGNAME: research
          - IMGNAME: cvemaker
          - IMGNAME: claude-codex
    steps:
      - name: Get current week-id
        id: date
        run: echo "Weekid=$(date +'%Y%U')" >> "$GITHUB_OUTPUT"
      - name: Checkout from repository.
        uses: actions/checkout@v4
      - name: Resolve checkout versions and image dependencies
        id: image
        run: python3 scripts/image_build.py ${{ matrix.IMGNAME }} >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push to Docker Hub.
        uses: docker/build-push-action@v6
        with:
          context: dockerfiles/${{matrix.IMGNAME}}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.MYNAME }}/${{ matrix.IMGNAME }}:latest
            ${{ env.MYNAME }}/${{ matrix.IMGNAME }}:${{ steps.date.outputs.Weekid }}
          build-args: |
            ${{ steps.image.outputs.build_args }}
